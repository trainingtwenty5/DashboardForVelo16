  const jawne = await crypto.subtle.decrypt({name:"AES-GCM", iv:IV}, klucz, CT);
  /* strona jest spakowana przed zaszyfrowaniem - rozpakowujemy w locie */
  const strumien = new Blob([jawne]).stream()
        .pipeThrough(new DecompressionStream("deflate"));
  return await new Response(strumien).text();
}

async function otworz(haslo, cicho){
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Odszyfrowuję…";
  try {
    const html = await odszyfruj(haslo);
    try { sessionStorage.setItem(KLUCZ_SESJI, haslo); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem(KLUCZ_SESJI); } catch (e2) {}
    btn.disabled = false;
    btn.textContent = "Pokaż dashboard";
    if (!cicho){ err.textContent = "Nieprawidłowe hasło."; pole.select(); }
  }
}

document.getElementById("f").onsubmit = ev => {
  ev.preventDefault();
  if (pole.value) otworz(pole.value, false);
};

if (!window.crypto || !crypto.subtle){
  err.textContent = "Ta strona musi być otwarta przez https — inaczej "
                  + "przeglądarka nie udostępnia odszyfrowywania.";
  btn.disabled = true;
} else if (typeof DecompressionStream === "undefined"){
  err.textContent = "Ta przeglądarka jest za stara. Użyj aktualnego Chrome, Edge lub Firefoksa.";
  btn.disabled = true;
} else {
  let zapamietane = "";
  try { zapamietane = sessionStorage.getItem(KLUCZ_SESJI) || ""; } catch (e) {}
  if (zapamietane) otworz(zapamietane, true);
}
</script>
