<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velo16 — wysyłka i skrzynka</title>
<style>
  :root{
    --bg:#1b1b1a; --panel:#242322; --panel2:#2b2a28; --line:#37352f;
    --text:#ece8e1; --muted:#9c968b; --accent:#f2a53c;
    --ok:#199e70; --bad:#e66767; --err:#9085e9; --wait:#8a857a;
    --blue:#3987e5; --orange:#d95926;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);line-height:1.45;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    padding:28px clamp(14px,3vw,44px) 60px}
  a{color:var(--accent)}
  h1{font-size:19px;margin:0;font-weight:700}
  .masthead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;
    gap:6px 24px;border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:12.5px}
  .warn{background:#3a2a24;border:1px solid #5c3f33;color:#f0c7b5;padding:9px 12px;
    font-size:12.5px;margin-top:14px}
  /* ---- zakladki ---- */
  .tabs{display:flex;gap:2px;flex-wrap:wrap;margin:18px 0 0;border-bottom:1px solid var(--line)}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
    font:inherit;font-size:13px;padding:9px 13px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .tab .badge{color:var(--muted);font-size:11.5px;margin-left:5px;font-weight:400}
  /* ---- kafelki ---- */
  .label{font-size:13px;font-weight:600;margin:30px 0 10px;padding-bottom:6px;
    border-bottom:1px solid var(--line)}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:1px;background:var(--line);border:1px solid var(--line)}
  .field{background:var(--panel);padding:14px 13px}
  .field .v{font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;font-size:24px;font-weight:600}
  .field .l{font-size:12px;color:var(--muted);margin-top:3px}
  .v.ok{color:var(--ok)} .v.bad{color:var(--bad)} .v.err{color:var(--err)}
  .v.acc{color:var(--accent)} .v.mut{color:var(--muted)}
  /* ---- wykresy ---- */
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);padding:14px 14px 10px}
  .card h3{margin:0 0 2px;font-size:13px;font-weight:600}
  .card .hint{color:var(--muted);font-size:11.5px;margin:0 0 10px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .grid line{stroke:var(--line);stroke-width:1}
  .ax{fill:var(--muted);font-size:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .dlabel{fill:var(--text);font-size:11px;font-weight:600;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .statusbar{display:flex;gap:2px;height:26px;margin:6px 0 2px}
  .statusbar div{min-width:2px}
  /* ---- listy ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font:inherit;font-size:12.5px;padding:6px 11px;cursor:pointer;border-radius:3px}
  .chip:hover{color:var(--text)}
  .chip[aria-pressed="true"]{background:var(--panel2);color:var(--text);
    border-color:#514c42;font-weight:600}
  .chip .n{font-family:ui-monospace,Menlo,Consolas,monospace;margin-left:6px;font-size:11.5px}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);
    font:inherit;font-size:12.5px;padding:7px 10px;min-width:210px;flex:1 1 210px;border-radius:3px}
  .btn{background:var(--accent);border:none;color:#241a08;font:inherit;font-weight:600;
    font-size:12.5px;padding:7px 13px;cursor:pointer;border-radius:3px}
  .btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{padding:8px 11px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line);
    vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel2);
    cursor:pointer;white-space:nowrap}
  tbody tr:hover{background:var(--panel2)}
  td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
  td.note{color:var(--muted);max-width:340px}
  .pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;
    white-space:nowrap}
  .pill.dostarczony{background:rgba(25,158,112,.16);color:#4bc79a}
  .pill.odbity{background:rgba(230,103,103,.16);color:var(--bad)}
  .pill.blad{background:rgba(144,133,233,.16);color:#b0a8f0}
  .pill.oczekuje{background:rgba(156,150,139,.14);color:var(--muted)}
  .more{margin:10px 0 0;text-align:center}
  .foot{color:var(--muted);font-size:11.5px;margin-top:34px;border-top:1px solid var(--line);
    padding-top:12px}
  #tip{position:fixed;pointer-events:none;background:#100f0e;border:1px solid #4a453c;
    padding:7px 10px;font-size:12px;border-radius:4px;opacity:0;transition:opacity .08s;
    z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.45);max-width:250px}
  #tip b{color:var(--accent)}
  #tip .row{display:flex;justify-content:space-between;gap:14px}
  #tip .row i{font-style:normal;color:var(--muted)}
  @media (max-width:560px){ body{padding:18px 14px 50px} .field .v{font-size:20px} }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const C = {dostarczony:'#199e70', odbity:'#e66767', blad:'#9085e9', oczekuje:'#8a857a',
           blue:'#3987e5', orange:'#d95926'};
const LBL = {dostarczony:'Dostarczone', odbity:'Odbite (nieaktualne)',
             blad:'Błąd SMTP (nie wyszło)', oczekuje:'W kolejce'};
const nf = new Intl.NumberFormat('pl-PL');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tip = document.getElementById('tip');
function showTip(ev, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.style.opacity = 0;
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function niceMax(v){
  if (v <= 5) return Math.max(v, 1);
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / (p/2)) * (p/2);
}
const shortDate = d => d ? d.slice(8,10) + '.' + d.slice(5,7) : '';

/* ============================ WYKRESY ============================ */
const KEYS = ['dostarczony','odbity','blad'];

function stackedBars(host, daily){
  if (!daily.length){ host.innerHTML = '<p class="hint">Brak dni z wysyłką.</p>'; return; }
  const W = 640, H = 210, ML = 34, MR = 8, MT = 10, MB = 24;
  const iw = W - ML - MR, ih = H - MT - MB;
  const tot = d => KEYS.reduce((s,k) => s + (d[k]||0), 0);
  const max = niceMax(Math.max(...daily.map(tot)));
  const step = iw / daily.length;
  const bw = Math.max(3, Math.min(46, step - 6));
  const y = v => MT + ih - (v / max) * ih;

  const svg = el('svg', {viewBox:'0 0 ' + W + ' ' + H, role:'img',
                         'aria-label':'Wysylka dzien po dniu wedlug statusu'});
  const g = el('g', {class:'grid'}, svg);
  for (let i = 0; i <= 4; i++){
    const yy = MT + ih * i / 4;
    el('line', {x1:ML, x2:W-MR, y1:yy, y2:yy}, g);
    el('text', {x:ML-6, y:yy+3, 'text-anchor':'end', class:'ax'}, svg)
      .textContent = nf.format(Math.round(max - max*i/4));
  }
  daily.forEach((d, i) => {
    const x = ML + i*step + (step-bw)/2;
    let acc = 0;
    KEYS.forEach((k, ki) => {
      const v = d[k] || 0;
      if (!v) return;
      const h = (v/max)*ih;
      const isTop = KEYS.slice(ki+1).every(kk => !(d[kk]||0));
      el('rect', {x:x, y:y(acc+v), width:bw, height:Math.max(1, h - (acc ? 2 : 0)),
                  fill:C[k], rx:isTop ? 4 : 0, ry:isTop ? 4 : 0}, svg);
      acc += v;
    });
    if (daily.length <= 22 || i % Math.ceil(daily.length/12) === 0)
      el('text', {x:ML + i*step + step/2, y:H-7, 'text-anchor':'middle', class:'ax'}, svg)
        .textContent = shortDate(d.date);
    const hit = el('rect', {x:ML+i*step, y:MT, width:step, height:ih, fill:'transparent'}, svg);
    hit.addEventListener('mousemove', ev => showTip(ev,
      '<b>' + d.date + '</b>' + KEYS.map(k =>
        '<div class="row"><i>' + LBL[k] + '</i><span>' + nf.format(d[k]||0) + '</span></div>').join('')
      + '<div class="row"><i>razem</i><span>' + nf.format(tot(d)) + '</span></div>'));
    hit.addEventListener('mouseleave', hideTip);
  });
  host.appendChild(svg);
}

function cumulativeLine(host, daily){
  if (!daily.length){ host.innerHTML = '<p class="hint">Brak danych.</p>'; return; }
  const W = 640, H = 210, ML = 40, MR = 58, MT = 12, MB = 24;
  const iw = W - ML - MR, ih = H - MT - MB;
  let a = 0, b = 0;
  const pts = daily.map(d => {
    a += (d.dostarczony||0) + (d.odbity||0);
    b += (d.dostarczony||0);
    return {date:d.date, sent:a, ok:b};
  });
  const max = niceMax(a || 1);
  const X = i => ML + (pts.length === 1 ? iw/2 : iw * i/(pts.length-1));
  const Y = v => MT + ih - (v/max)*ih;

  const svg = el('svg', {viewBox:'0 0 ' + W + ' ' + H, role:'img',
                         'aria-label':'Narastajaco: wyslane i dostarczone'});
  const g = el('g', {class:'grid'}, svg);
  for (let i = 0; i <= 4; i++){
    const yy = MT + ih*i/4;
    el('line', {x1:ML, x2:W-MR, y1:yy, y2:yy}, g);
    el('text', {x:ML-6, y:yy+3, 'text-anchor':'end', class:'ax'}, svg)
      .textContent = nf.format(Math.round(max - max*i/4));
  }
  [['sent', C.blue], ['ok', C.dostarczony]].forEach(pair => {
    const k = pair[0], col = pair[1];
    el('path', {d: pts.map((p,i) => (i?'L':'M') + X(i) + ' ' + Y(p[k])).join(' '),
                fill:'none', stroke:col, 'stroke-width':2,
                'stroke-linejoin':'round', 'stroke-linecap':'round'}, svg);
    const last = pts[pts.length-1];
    el('circle', {cx:X(pts.length-1), cy:Y(last[k]), r:4, fill:col,
                  stroke:'#242322', 'stroke-width':2}, svg);
    el('text', {x:X(pts.length-1)+8, y:Y(last[k])+4, class:'dlabel', fill:col}, svg)
      .textContent = nf.format(last[k]);
  });
  pts.forEach((p,i) => {
    if (pts.length <= 22 || i % Math.ceil(pts.length/12) === 0)
      el('text', {x:X(i), y:H-7, 'text-anchor':'middle', class:'ax'}, svg)
        .textContent = shortDate(p.date);
  });
  const cross = el('line', {y1:MT, y2:MT+ih, stroke:'#5b564c', 'stroke-width':1, opacity:0}, svg);
  const hit = el('rect', {x:ML, y:MT, width:iw, height:ih, fill:'transparent'}, svg);
  hit.addEventListener('mousemove', ev => {
    const box = svg.getBoundingClientRect();
    const rel = (ev.clientX - box.left) / box.width * W;
    let i = Math.round((rel - ML) / (iw / Math.max(1, pts.length-1)));
    i = Math.max(0, Math.min(pts.length-1, i));
    const p = pts[i];
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i));
    cross.setAttribute('opacity', 1);
    showTip(ev, '<b>' + p.date + '</b>'
      + '<div class="row"><i>wysłane łącznie</i><span>' + nf.format(p.sent) + '</span></div>'
      + '<div class="row"><i>dostarczone</i><span>' + nf.format(p.ok) + '</span></div>'
      + '<div class="row"><i>odbite</i><span>' + nf.format(p.sent-p.ok) + '</span></div>');
  });
  hit.addEventListener('mouseleave', () => { hideTip(); cross.setAttribute('opacity', 0); });
  host.appendChild(svg);
}

function statusSplit(host, k){
  const parts = [['dostarczony', k.delivered], ['odbity', k.bounced],
                 ['blad', k.errors], ['oczekuje', k.waiting]].filter(p => p[1] > 0);
  const total = parts.reduce((s,p) => s + p[1], 0) || 1;
  const bar = document.createElement('div');
  bar.className = 'statusbar';
  parts.forEach(p => {
    const key = p[0], v = p[1];
    const d = document.createElement('div');
    d.style.cssText = 'flex:' + v + ' 0 0;background:' + C[key] + ';border-radius:2px';
    d.addEventListener('mousemove', ev => showTip(ev,
      '<b>' + LBL[key] + '</b><div class="row"><i>' + nf.format(v) + ' adresów</i><span>'
      + (100*v/total).toFixed(1) + '%</span></div>'));
    d.addEventListener('mouseleave', hideTip);
    bar.appendChild(d);
  });
  host.appendChild(bar);
  const leg = document.createElement('div');
  leg.className = 'legend';
  leg.innerHTML = parts.map(p =>
    '<span><i class="swatch" style="background:' + C[p[0]] + '"></i>' + LBL[p[0]]
    + ' <b style="color:var(--text)">' + nf.format(p[1]) + '</b> ('
    + (100*p[1]/total).toFixed(1) + '%)</span>').join('');
  host.appendChild(leg);
}

function legendFor(items){
  return '<div class="legend">' + items.map(it =>
    '<span><i class="swatch" style="background:' + it[0] + '"></i>' + it[1] + '</span>').join('')
    + '</div>';
}

/* ============================ LISTY + CSV ============================ */
const STATE = {};

function csvEscape(v){
  const s = String(v == null ? '' : v);
  return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(name, rows, header){
  const lines = [header.join(';')].concat(rows.map(r => r.map(csvEscape).join(';')));
  /* BOM, zeby Excel poprawnie pokazal polskie znaki */
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
const CSV_HEAD = ['email','firma','status','data_wysylki','proby','odpowiedz',
                  'data_odbicia','szczegoly'];
const toRow = r => [r.email, r.name, LBL[r.status] || r.status, r.date, r.attempts,
                    r.reply || '', r.bounce_date || '', r.info || ''];

function filtered(camp){
  const st = STATE[camp.key];
  let rows = camp.records;
  if (st.filter === 'odpowiedzi') rows = rows.filter(r => r.reply);
  else if (st.filter !== 'all') rows = rows.filter(r => r.status === st.filter);
  const q = st.q.trim().toLowerCase();
  if (q) rows = rows.filter(r =>
    r.email.toLowerCase().indexOf(q) >= 0
    || (r.name||'').toLowerCase().indexOf(q) >= 0
    || (r.info||'').toLowerCase().indexOf(q) >= 0);
  const dir = st.dir, key = st.sort;
  return rows.slice().sort((a,b) => {
    const va = a[key] == null ? '' : a[key], vb = b[key] == null ? '' : b[key];
    if (va === vb) return a.email.localeCompare(b.email);
    return (va > vb ? 1 : -1) * dir;
  });
}

function renderTable(camp){
  const st = STATE[camp.key];
  const rows = filtered(camp);
  const shown = rows.slice(0, st.limit);
  document.getElementById('tb-' + camp.key).innerHTML = shown.map(r =>
    '<tr><td class="mono">' + esc(r.email) + '</td>'
    + '<td>' + esc(r.name) + '</td>'
    + '<td><span class="pill ' + r.status + '">' + LBL[r.status] + '</span></td>'
    + '<td class="mono">' + esc(r.date || '—') + '</td>'
    + '<td class="mono">' + (r.reply ? '✓ ' + esc(r.reply) : '—') + '</td>'
    + '<td class="note">' + esc(r.info || '') + '</td></tr>').join('')
    || '<tr><td colspan="6" style="color:var(--muted)">Brak pozycji dla tego filtra.</td></tr>';
  document.getElementById('cnt-' + camp.key).textContent =
    nf.format(shown.length) + ' z ' + nf.format(rows.length);
  document.getElementById('more-' + camp.key).innerHTML = rows.length > st.limit
    ? '<button class="chip" data-more="1">Pokaż kolejne 500 (zostało '
      + nf.format(rows.length - st.limit) + ')</button>' : '';
}

/* ============================ PANEL ============================ */
function kpiTiles(k, extra){
  const f = (v, cls, l) => '<div class="field"><div class="v ' + cls + '">' + v
    + '</div><div class="l">' + l + '</div></div>';
  return '<div class="fields">'
    + f(nf.format(k.sent), '', 'maile wysłane')
    + f(nf.format(k.delivered), 'ok', 'dostarczone')
    + f(nf.format(k.bounced), 'bad', 'odbite — adres nieaktualny')
    + f(k.bounce_rate + '%', 'bad', 'odsetek odbić')
    + f(nf.format(k.errors), 'err', 'błąd SMTP — nie wyszło')
    + f(nf.format(k.waiting), 'mut', 'w kolejce')
    + f(nf.format(k.replies), 'acc', 'odpowiedzi')
    + f(nf.format(k.contacts), 'mut', 'adresów na listach')
    + (extra || '') + '</div>';
}

function mergeDaily(camps){
  const map = {};
  camps.forEach(c => c.daily.forEach(d => {
    const t = map[d.date] || (map[d.date] = {date:d.date, dostarczony:0, odbity:0, blad:0});
    KEYS.forEach(k => t[k] += d[k] || 0);
  }));
  return Object.keys(map).sort().map(k => map[k]);
}

function renderPanel(key){
  const panel = document.getElementById('panel');
  const isAll = key === '__all__';
  const camp = isAll
    ? {key:'__all__', label:'Wszystkie kampanie', folder:'.', kpi:DATA.totals,
       daily:mergeDaily(DATA.campaigns),
       records:DATA.campaigns.reduce((acc,c) => acc.concat(c.records), []),
       log_files:[], contact_files:[]}
    : DATA.campaigns.filter(c => c.key === key)[0];
  if (!camp){ panel.innerHTML = ''; return; }
  if (!STATE[camp.key]) STATE[camp.key] = {filter:'all', q:'', limit:500, sort:'date', dir:-1};
  const st = STATE[camp.key];

  const counts = {all:camp.records.length,
                  odpowiedzi:camp.records.filter(r => r.reply).length};
  ['dostarczony','odbity','blad','oczekuje'].forEach(s =>
    counts[s] = camp.records.filter(r => r.status === s).length);

  const rev = isAll
    ? '<div class="field"><div class="v acc">' + (DATA.revenue_total||0).toFixed(2)
      + ' zł</div><div class="l">wykryty przychód</div></div>'
      + '<div class="field"><div class="v acc">'
      + ((DATA.revenue_total||0)*DATA.revenue_share).toFixed(2)
      + ' zł</div><div class="l">0,5% z przychodu</div></div>'
    : '';

  const src = [camp.folder && camp.folder !== '.'
                 ? 'folder <code>' + esc(camp.folder) + '</code>' : 'folder główny',
               (camp.log_files||[]).length ? camp.log_files.length + ' plików logu' : '',
               (camp.contact_files||[]).length
                 ? 'listy: ' + camp.contact_files.map(esc).join(', ') : '']
              .filter(Boolean).join(' · ');

  const chips = [['all','Wszystkie'],['dostarczony','Dostarczone'],
                 ['odbity','Odbite (nieaktualne)'],['blad','Błąd SMTP'],
                 ['oczekuje','W kolejce'],['odpowiedzi','Odpowiedzi']];

  panel.innerHTML =
    '<div class="label">' + esc(camp.label) + '</div>'
    + '<p class="sub" style="margin:-4px 0 12px">' + src + '</p>'
    + kpiTiles(camp.kpi, rev)
    + '<div class="label">Przebieg w czasie — od pierwszego logu (' + esc(DATA.first_log_date) + ')</div>'
    + '<div class="charts">'
    +   '<div class="card"><h3>Wysyłka dzień po dniu</h3>'
    +     '<p class="hint">Adresy wg dnia ostatniej wysyłki, w podziale na statusy.</p>'
    +     '<div id="ch1"></div>'
    +     legendFor([[C.dostarczony,'Dostarczone'],[C.odbity,'Odbite (nieaktualne)'],
                     [C.blad,'Błąd SMTP']]) + '</div>'
    +   '<div class="card"><h3>Narastająco</h3>'
    +     '<p class="hint">Ile maili poszło łącznie i ile z nich faktycznie doszło.</p>'
    +     '<div id="ch2"></div>'
    +     legendFor([[C.blue,'Wysłane łącznie'],[C.dostarczony,'Dostarczone']]) + '</div>'
    +   '<div class="card"><h3>Podział bazy</h3>'
    +     '<p class="hint">Cała lista kontaktów tej kampanii w jednym pasku.</p>'
    +     '<div id="ch3"></div></div>'
    + '</div>'
    + '<div class="label">Listy adresów — filtruj i pobierz do CSV</div>'
    + '<div class="toolbar">' + chips.map(c =>
        '<button class="chip" data-f="' + c[0] + '" aria-pressed="' + (st.filter===c[0])
        + '">' + c[1] + '<span class="n">' + nf.format(counts[c[0]]||0) + '</span></button>').join('')
    + '</div>'
    + '<div class="toolbar">'
    +   '<input type="search" id="q-' + camp.key + '" value="' + esc(st.q)
    +     '" placeholder="Szukaj: adres, firma, powód odbicia…">'
    +   '<button class="btn" data-csv="view">Pobierz widoczne CSV</button>'
    +   '<button class="btn ghost" data-csv="odbity">CSV odbitych</button>'
    +   '<button class="btn ghost" data-csv="dostarczony">CSV dostarczonych</button>'
    +   '<button class="btn ghost" data-csv="blad">CSV błędów</button>'
    +   '<button class="btn ghost" data-csv="oczekuje">CSV w kolejce</button>'
    +   '<span class="sub" id="cnt-' + camp.key + '"></span>'
    + '</div>'
    + '<div class="tablewrap"><table><thead><tr>'
    +   '<th data-sort="email">E-mail</th><th data-sort="name">Firma</th>'
    +   '<th data-sort="status">Status</th><th data-sort="date">Wysłano</th>'
    +   '<th data-sort="reply">Odpowiedź</th><th data-sort="info">Szczegóły</th>'
    + '</tr></thead><tbody id="tb-' + camp.key + '"></tbody></table></div>'
    + '<div class="more" id="more-' + camp.key + '"></div>';

  stackedBars(document.getElementById('ch1'), camp.daily);
  cumulativeLine(document.getElementById('ch2'), camp.daily);
  statusSplit(document.getElementById('ch3'), camp.kpi);
  renderTable(camp);

  panel.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    st.filter = b.dataset.f; st.limit = 500;
    panel.querySelectorAll('[data-f]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.f === st.filter));
    renderTable(camp);
  });
  const q = document.getElementById('q-' + camp.key);
  q.oninput = () => { st.q = q.value; st.limit = 500; renderTable(camp); };
  panel.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
    if (st.sort === th.dataset.sort) st.dir *= -1;
    else { st.sort = th.dataset.sort; st.dir = 1; }
    renderTable(camp);
  });
  document.getElementById('more-' + camp.key).onclick = ev => {
    if (ev.target.dataset.more){ st.limit += 500; renderTable(camp); }
  };
  panel.querySelectorAll('[data-csv]').forEach(b => b.onclick = () => {
    const kind = b.dataset.csv, stamp = (DATA.generated_at || '').slice(0,10);
    const rows = kind === 'view' ? filtered(camp)
                                 : camp.records.filter(r => r.status === kind);
    const tag = kind === 'view' ? st.filter : kind;
    downloadCSV('velo16_' + camp.key + '_' + tag + '_' + stamp + '.csv',
                rows.map(toRow), CSV_HEAD);
  });
}

/* ============================ START ============================ */
(function init(){
  document.getElementById('meta').textContent =
    'Aktualizacja: ' + String(DATA.generated_at || '—').replace('T', ' ');
  document.getElementById('submeta').innerHTML =
    'Dane z logów od <b>' + esc(DATA.first_log_date) + '</b> · skrzynki: '
    + DATA.mailboxes.map(esc).join(', ')
    + (DATA.public ? ' · <b>adresy zamaskowane w wersji publicznej</b>' : '');

  const msgs = [];
  if ((DATA.imap_errors||[]).length)
    msgs.push('Nie udało się zalogować na skrzynkę: ' + DATA.imap_errors.map(esc).join('; ')
      + ' — liczby odbić mogą być niepełne.');
  if ((DATA.totals||{}).errors)
    msgs.push('<b>' + nf.format(DATA.totals.errors) + '</b> adresów odrzucił serwer SMTP '
      + '(kod 534 = Gmail nie przyjął hasła aplikacji). Te maile <b>w ogóle nie wyszły</b> '
      + '— warto je wysłać ponownie.');
  if ((DATA.orphan_bounces||[]).length)
    msgs.push(nf.format(DATA.orphan_bounces.length)
      + ' odbić dotyczy adresów spoza list kampanii (starsze wysyłki) — są w pliku JSON.');
  document.getElementById('warnings').innerHTML =
    msgs.map(m => '<div class="warn">' + m + '</div>').join('');

  const tabs = document.getElementById('tabs');
  const items = [{key:'__all__', label:'Wszystkie', n:DATA.totals.sent}]
    .concat(DATA.campaigns.map(c => ({key:c.key, label:c.label, n:c.kpi.sent})));
  tabs.innerHTML = items.map((t,i) =>
    '<button class="tab" role="tab" data-k="' + esc(t.key) + '" aria-selected="' + (i===0)
    + '">' + esc(t.label) + '<span class="badge">' + nf.format(t.n) + '</span></button>').join('');
  tabs.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    tabs.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
    renderPanel(b.dataset.k);
  });
  const start = decodeURIComponent((location.hash || '').slice(1));
  const found = items.filter(t => t.key === start)[0];
  if (found) tabs.querySelectorAll('.tab').forEach(x =>
    x.setAttribute('aria-selected', x.dataset.k === found.key));
  renderPanel(found ? found.key : '__all__');
})();
</script>
